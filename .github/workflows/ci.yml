name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[aiohttp]" pytest
      - run: python -c "from loonfs_sdk import LoonFS, AsyncLoonFS"
      - run: python -m pytest src/loonfs_sdk/tests -q
      - run: python -m compileall -q src
