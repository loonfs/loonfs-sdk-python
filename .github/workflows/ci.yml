name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.8 is the advertised floor; the import must stay valid there.
        python-version: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[aiohttp]" pytest
      - run: python -c "from loonfs.server import LoonFS, AsyncLoonFS"
      - run: python -c "import loonfs; assert not hasattr(loonfs, 'LoonFS')"
      - run: python -m pytest src/loonfs/tests -q
      - run: python -c "import loonfs.proxy, loonfs.transfers"
