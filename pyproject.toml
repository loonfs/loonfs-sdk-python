[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loonfs"
version = "0.1.0"
description = "Python client for the LoonFS HTTP API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.21.2",
    "pydantic>=1.9.2",
    "pydantic-core>=2.18.2",
    "typing_extensions>=4.0.0",
]

[project.optional-dependencies]
aiohttp = ["httpx-aiohttp>=0.1.8"]

[project.urls]
Documentation = "https://www.loonfs.com/docs/sdks/"
Issues = "https://github.com/loonfs/loonfs/issues"
Repository = "https://github.com/loonfs/loonfs-sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["src/loonfs"]
exclude = [
    "src/loonfs/.fern",
    "src/loonfs/tests",
]
